server:
  name: commercetools MCP (Knowledge MCP + Commerce MCP)
  servers:
  - name: Knowledge MCP
    endpoint: https://docs.commercetools.com/apis/mcp
    transport: streamable-http
    auth: none
    note: 'Live: initialize + tools/list answered 200 anonymously on 2026-10-12 (serverInfo "commercetools knowledge" 1.0.0); docs state it is rate limited.'
  - name: Commerce MCP (self-hosted)
    install: npx -y @commercetools/commerce-mcp
    package: https://www.npmjs.com/package/@commercetools/commerce-mcp
    transport: stdio
    auth: api-key
    note: Requires an API Client for a Project.
  - name: Managed MCP Servers
    note: Hosted Commerce MCP configured per Project via the API or Merchant Center; per-server endpoint is project-specific and not published. Auth modes ClientCredentials or CommercetoolsIdentity.
auth: none (Knowledge MCP); OAuth2 client credentials / commercetools Identity (Commerce MCP)
deployment:
  mode: both
  endpoint: https://docs.commercetools.com/apis/mcp
  install: npx -y @commercetools/commerce-mcp
  package: https://www.npmjs.com/package/@commercetools/commerce-mcp
  auth: none
  verified: probed
tools:
- name: commercetools-documentation-search
  description: 'Retrieves documentation content chunks that are semantically similar to the input. Use this tool to find domain concepts, business behavior explanations, and reference material from the
    commercetools documentation.

    Inline links in the content use markdown format [text](url). The URL usually points to the commercetools documentation portal but can also point to API reference docs or external resour'
  inputSchema:
    $schema: http://json-schema.org/draft-07/schema#
    type: object
    properties:
      query:
        type: string
        description: The text to find semantically similar content to. Full sentences describing the context of the situation or problem yield better results than just keywords.
      limit:
        default: 10
        description: The maximum number of results to return across all content types.
        type: number
      crowding:
        default: 5
        description: The maximum number of results to return per document type. Avoids over-representation of certain content types.
        type: number
      contentTypes:
        default:
        - referenceDocs
        - guidedDocs
        - userDocs
        description: return only the given content types to focus or expand the defaults. "apiType" and "apiEndpoint" return natural language descriptions of the REST API surface. "guidedDocs" includes
          best practice guides, tutorials, and learning content. "referenceDocs" covers reference material. "userDocs" is end-user-facing documentation. "otherDocsPage" covers content that does not fit
          the other categories. "Skill" includes reference content linked from agent skills.
        type: array
        items:
          type: string
          enum:
          - apiType
          - apiEndpoint
          - referenceDocs
          - guidedDocs
          - userDocs
          - otherDocsPage
          - Skill
      excludeContentTypes:
        default: []
        description: exclude the given content types from the results.
        type: array
        items:
          type: string
          enum:
          - apiType
          - apiEndpoint
          - referenceDocs
          - guidedDocs
          - userDocs
          - otherDocsPage
          - Skill
      products:
        default:
        - Composable Commerce
        - Checkout
        - Connect
        description: return only content about the given products. For example, if your application uses commercetools Frontend, add "Frontend" to the defaults, or, if you are not using the OOTB Checkout
          UI, remove "Checkout"
        type: array
        items:
          type: string
          enum:
          - Composable Commerce
          - Frontend
          - Checkout
          - Connect
          - InStore
          - AI Hub
      excludeProducts:
        default: []
        description: exclude the given products from the results.
        type: array
        items:
          type: string
          enum:
          - Composable Commerce
          - Frontend
          - Checkout
          - Connect
          - InStore
          - AI Hub
    required:
    - query
  server: knowledge-mcp
  evidence: live tools/list
