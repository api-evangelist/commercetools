- name: commercetools-rest-validate
  description: 'Validates REST API requests (method + path + body) against commercetools OpenAPI specifications offline. Returns detailed errors with suggestions for invalid requests.


    This tool checks:

    - Path exists in the API

    - HTTP method is allowed for that path

    - Request body matches the expected schema (types, required fields, enums, etc.)

    - Discriminator fields (like ''action'' in update requests) are valid

    '
  inputSchema:
    $schema: http://json-schema.org/draft-07/schema#
    type: object
    properties:
      method:
        type: string
        enum:
        - GET
        - POST
        - DELETE
        - PATCH
        - PUT
        - HEAD
        description: HTTP method for the request.
      path:
        type: string
        minLength: 1
        description: Request path (e.g., /my-project/products). Include the project key as the first segment.
