description: >-
  commercetools is the leading composable, headless, API-first Commerce platform powering large-scale B2C, B2B, and
  marketplace digital commerce for enterprise brands. The platform exposes a broad API surface organized into the HTTP
  API (core REST interface), GraphQL API (flexible query and mutation alternative), Import API (bulk data ingestion),
  Change History API (audit log), Checkout API (managed checkout configuration), and Merchant Center Customizations API
  (custom UI extensions). It is complemented by official SDKs (TypeScript, Java, PHP, .NET, Python) and AsyncAPI-based
  subscriptions for event-driven integrations.
