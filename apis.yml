apis:
- aid: commercetools:graphql-api
  name: Commercetools GraphQL API
  tags:
  - Commerce
  - Composable Commerce
  - E-Commerce
  - GraphQL
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://api.{region}.commercetools.com
  humanURL: https://docs.commercetools.com/api/graphql
  properties:
  - url: https://docs.commercetools.com/api/graphql
    type: Documentation
  - url: graphql/commercetools-graphql.md
    type: GraphQL
  description: The commercetools GraphQL API provides a flexible, network-efficient alternative to the HTTP API for querying and mutating Composable
    Commerce resources. It exposes a single endpoint and allows clients to request exactly the data they need, reducing over-fetching and minimizing
    round trips. The GraphQL API uses the same API clients, authentication tokens, and project scopes as the HTTP API.
- aid: commercetools:typescript-sdk
  name: Commercetools TypeScript SDK
  tags:
  - Commerce
  - JavaScript
  - SDK
  - TypeScript
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://api.{region}.commercetools.com
  humanURL: https://docs.commercetools.com/sdk/typescript-sdk
  properties:
  - url: https://docs.commercetools.com/sdk/typescript-sdk
    type: Documentation
  description: The commercetools TypeScript SDK is the official client library for interacting with the Composable Commerce HTTP API, Import API,
    and GraphQL API from JavaScript and TypeScript applications. It provides full type safety, IDE autocompletion, and a fluent domain-specific
    language for constructing valid API requests. The SDK handles OAuth 2.0 token management, request building, and response deserialization.
- aid: commercetools:java-sdk
  name: Commercetools Java SDK
  tags:
  - Commerce
  - Java
  - JVM
  - SDK
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://api.{region}.commercetools.com
  humanURL: https://docs.commercetools.com/sdk/java-sdk
  properties:
  - url: https://docs.commercetools.com/sdk/java-sdk
    type: Documentation
  description: The commercetools Java SDK is the official client library for accessing the Composable Commerce APIs from Java applications. It
    provides strongly typed request builders, automatic OAuth 2.0 token management, and support for all HTTP API and Import API endpoints. The
    SDK is compatible with standard Java development toolchains and is distributed via Maven Central. It is commonly used in enterprise backend
    systems and microservices that require JVM-based integration with the commercetools platform.
- aid: commercetools:checkout-api
  name: Commercetools Checkout API
  tags:
  - Checkout
  - Commerce
  - Embedded Components
  - Payments
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://api.example.com
  humanURL: https://docs.commercetools.com/checkout
  properties:
  - url: https://docs.commercetools.com/checkout
    type: Documentation
  description: The commercetools Checkout API provides programmatic control over Checkout application configurations within Composable Commerce.
    The Checkout Applications API allows developers to create, update, and manage Checkout applications without manual setup in the Merchant Center,
    enabling automated deployment and configuration across multiple stores, regions, and business units. Checkout integrates with payment connectors
    available through the Connect marketplace.
- aid: commercetools:merchant-center-customizations-api
