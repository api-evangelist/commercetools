  properties:
  - url: https://docs.commercetools.com/merchant-center-customizations/concepts/merchant-center-api
    type: Documentation
  description: The commercetools Merchant Center Customizations API provides the programmatic interface for building custom applications and UI
    extensions within the Merchant Center. It exposes proxy endpoints to underlying REST and GraphQL APIs, allowing custom UIs to interact with
    Composable Commerce resources in a secure, scoped manner. Developers use this API when creating Custom Applications that extend the Merchant
    Center with business-specific tooling.
